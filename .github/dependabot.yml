version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - ci

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 2
    versioning-strategy: increase-if-necessary
    groups:
      python-tooling:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - mypy
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - python
