name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 20 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Run tests
        run: make test

  tests_complete:
    name: Tests
    needs: tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify the Python matrix
        env:
          MATRIX_RESULT: ${{ needs.tests.result }}
        run: test "$MATRIX_RESULT" = success

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Type-check and compile
        run: make typecheck compile

      - name: Run Stage 04 contracts
        run: make spec

      - name: Run repository-only Agent Doctor policy
        run: make audit

      - name: Retain sealed CI envelope
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: agent-doctor-ci-result
          path: build/reports/agent-doctor-ci.json
          if-no-files-found: warn
          retention-days: 14

  package:
    name: Package
    needs:
      - tests_complete
      - contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install build dependency
        run: python -m pip install 'build>=1.2,<2'

      - name: Build distributions
        run: make package

      - name: Install wheel and smoke test
        run: |
          python -m pip install --force-reinstall dist/*.whl
          agent-doctor --version
          agent-doctor scan . --project-trust trusted --format terminal
          agent-doctor model resolve --capability codex.advisory_review --as-of 2026-08-17

      - name: Retain distributions
        uses: actions/upload-artifact@v6
        with:
          name: agent-doctor-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 14
